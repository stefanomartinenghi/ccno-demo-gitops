apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ccno-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/stefanomartinenghi/ccno-demo-gitops.git
    targetRevision: main
    path: demo-app/k8s/overlays/local

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
